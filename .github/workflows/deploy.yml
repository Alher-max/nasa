name: Deploy Carbon Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Update dependencies and restart backend
        run: |
          cd /var/www/thortech/carbon/backend
          git stash --include-untracked || true
          git pull origin main
          source venv/bin/activate
          pip install -r requirements.txt
          sudo systemctl restart carbon-backend
